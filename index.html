<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solish | Pride and Peace</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <header class="hero-section">
        <div class="hero-content">
            <h1 class="heritage-shadow">Sol-ish</h1>
            <p class="phonetic" aria-label="Pronunciation">/ˈsɒl.ɪʃ /</p>
            <p class="lead">A postcode for the settled hearts: Pride and Peace</p>
            <button type="button" class="btn btn-outline-light" id="openModalBtn">
                Contact a Solishman
            </button>
        </div>
    </header>

    <main class="container my-5">
        <div id="definitionGrid" class="dictionary-grid"></div>
    </main>

    <div class="modal-overlay" id="qrModal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">The Community Board</h5>
                <button type="button" class="btn-close" id="closeModalBtn" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <p class="form-label small">Show your Solishmanship – Leave a kindly message for your neighbors.</p>
                
                <form id="solishForm">
                    <div class="form-group">
                        <label for="message" class="form-label small">Message</label>
                        <textarea id="message" name="message" class="form-control" rows="6" required></textarea>
                    </div>
                    
                    <div class="form-group mt-4">
                        <label class="form-label small">You Send Your Message to:</label>
                        <div id="familyButtonsRow" class="button-grid"></div>    
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <small>
            <a href="https://solihulllife.org/" target="_blank">Refined British Culture</a> | 
            <a href="https://visitsolihull.co.uk/" target="_blank">Solihull</a> | 
            <a href="https://www.cloudflare.com/" target="_blank">Powered by Cloudflare</a>
        </small>
    </footer>

    <script src="content.js"></script>
</body>
</html>
